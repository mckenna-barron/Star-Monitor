    <main>
        <header class = "home-banner" >
            <h1><span id = "userDisplay"></span>'s Ocular Coherence Tomography Data Entry</h1>
        </header>

        <li></li>
        <h1>How to Assess Ocular Coherence Tomography Levels</h1>
        <p>This is currently in progress, and has not been developed.</p>
        <li></li>
        <li></li>

    <h2>Enter OCT Data</h2>
    <form id = "OCTForm">
        <input type = "number" id = "OCTNumber" placeholder = "OCT Number" required><br><br>
        <button type = "submit">Submit OCT Data</button>
    </form>

    <script>
        document.getElementById('OCTForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const enteredOCT = parseFloat(document.getElementById('OCTNumber').value);

            const MIN_OCT = 20;
            const MAX_OCT = 400;

            if (isNaN(enteredOCT) || enteredOCT < MIN_OCT || enteredOCT > MAX_OCT) {
                alert('Invalid entry. Please enter a biologically realistic OCT value');
                return;
            }

            const userStorageKey = `OCTHistory_${activeUser}`;

            let OCTHistory = JSON.parse(localStorage.getItem(userStorageKey)) || [];

            const newOCTDataPoint = {
                value: enteredOCT,
                timestamp: new Date().toISOString(),
                label: `Entry ${OCTHistory.length + 1}`
            };

            OCTHistory.push(newOCTDataPoint);
            localStorage.setItem(userStorageKey, JSON.stringify(OCTHistory));

            alert('Data successfully entered.');
            window.location.href = '/pages/infoPage.html';
        });
    </script>
        <li></li>
        <li></li>
    </main>

    <script>
        document.getElementById('userDisplay').textContent = activeUser;

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/pages/login.html';
        }
    </script>
</body>
</html>
