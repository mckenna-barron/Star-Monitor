    <main>
        <header class = "home-banner" >
            <h1><span id = "userDisplay"></span>'s Electrocardiogram Data Entry</h1>
        </header>

        <li></li>
        <h1>How to Assess Electrocardiogram Levels</h1>
        <p>This is currently in progress, and has not been developed.</p>
        <li></li>
        <li></li>

    <h2>Enter Electrocardiogram Data</h2>
    <form id = "ekgForm">
        <input type = "number" id = "ekgNumber" placeholder = "EKG Number" required><br><br>
        <button type = "submit">Submit EKG Data</button>
    </form>

    <script>
        document.getElementById('ekgForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const enteredEKG = parseFloat(document.getElementById('ekgNumber').value);

            const MIN_EKG = 20;
            const MAX_EKG = 400;

            if (isNaN(enteredEKG) || enteredEKG < MIN_EKG || enteredEKG > MAX_EKG) {
                alert('Invalid entry. Please enter a biologically realistic EKG value');
                return;
            }

            const userStorageKey = `ekgHistory_${activeUser}`;

            let ekgHistory = JSON.parse(localStorage.getItem(userStorageKey)) || [];

            const newEKGDataPoint = {
                value: enteredEKG,
                timestamp: new Date().toISOString(),
                label: `Entry ${ekgHistory.length + 1}`
            };

            ekgHistory.push(newEKGDataPoint);
            localStorage.setItem(userStorageKey, JSON.stringify(ekgHistory));

            alert('Data successfully entered.');
            window.location.href = '/pages/infoPage.html';
        });
    </script>
        <li></li>
        <li></li>
    </main>

    <script>
        document.getElementById('userDisplay').textContent = activeUser;

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/pages/login.html';
        }
    </script>
</body>
</html>
