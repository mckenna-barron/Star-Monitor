</head>

<body>
        <header class = "website-header">
        <div class = "logo-container">
            <a href = "/index.html" class = "logo-corner">
                <img src = "/imgs/NASA Space Apps Logos - 2026/Space Apps Logo Color and White.png" alt = "Website Logo" class = "logo-img">
                <img src = "/imgs/starmonitor-transparent.png" alt = "Program Logo" class = "logo-img2">
            </a>
        </div>

        <nav class = "navbar">
            <ul>
                <li><a href = "/pages/meetMars.html">Meet Mars!</a></li>
                <li><a href = "/pages/infoPage.html">Input Health Data</a></li>
                <li><a href = "/pages/infoViewPage.html" >View History</a></li>
                <li><a href = "/pages/viewHealthData.html">View Recommendations</a></li>
                <a onclick = "logout()">Log Out</a>
            </ul>
        </nav>
    </header>

    <main>
        <header class = "home-banner" >
            <h1><span id = "userDisplay"></span>'s HS-CRP Data Entry</h1>
        </header>

        <li></li>
        <h1>How to Assess HS-CRP Levels</h1>
        <p>This is currently in progress, and has not been developed.</p>
        <li></li>
        <li></li>

    <h2>Enter HS-CRP Data</h2>
    <form id = "hs-crpForm">
        <input type = "number" id = "hs-crpNumber" placeholder = "HS-CRP Number" required><br><br>
        <button type = "submit">Submit HS-CRP Data</button>
    </form>

    <script>
        document.getElementById('hs-crpForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const enteredHSCRP = parseFloat(document.getElementById('hs-crpNumber').value);

            const MIN_HSCRP = 20;
            const MAX_HSCRP = 400;

            if (isNaN(enteredHSCRP) || enteredHSCRP < MIN_HSCRP || enteredHSCRP > MAX_HSCRP) {
                alert('Invalid entry. Please enter a biologically realistic HS-CRP value');
                return;
            }

            const userStorageKey = `hscrpHistory_${activeUser}`;

            let hscrpHistory = JSON.parse(localStorage.getItem(userStorageKey)) || [];

            const newHSCRPDataPoint = {
                value: enteredHSCRP,
                timestamp: new Date().toISOString(),
                label: `Entry ${hscrpHistory.length + 1}`
            };

            hscrpHistory.push(newHSCRPDataPoint);
            localStorage.setItem(userStorageKey, JSON.stringify(hscrpHistory));

            alert('Data successfully entered.');
            window.location.href = '/pages/infoPage.html';
        });
    </script>
        <li></li>
        <li></li>
    </main>

    <script>
        document.getElementById('userDisplay').textContent = activeUser;

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/pages/login.html';
        }
    </script>
</body>
</html>
