        <li></li>
        <h1>How to Assess Protein Levels</h1>

        <li></li>

    <h2>Enter Protein Data</h2>
    <form id = "PRForm">
        <input type = "number" id = "PRNumber" placeholder = "Protein Number" required><br><br>
        <button type = "submit">Submit Protein Data</button>
    </form>

    <script>
        document.getElementById('PRForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const enteredPR = parseFloat(document.getElementById('PRNumber').value);

            const MIN_PR = 20;
            const MAX_PR = 400;

            if (isNaN(enteredPR) || enteredPR < MIN_PR || enteredPR > MAX_PR) {
                alert('Invalid entry. Please enter a biologically realistic protein value');
                return;
            }

            const userStorageKey = `PRHistory_${activeUser}`;

            let PRHistory = JSON.parse(localStorage.getItem(userStorageKey)) || [];

            const newPRDataPoint = {
                value: enteredPR,
                timestamp: new Date().toISOString(),
                label: `Entry ${PRHistory.length + 1}`
            };

            PRHistory.push(newPRDataPoint);
            localStorage.setItem(userStorageKey, JSON.stringify(PRHistory));

            alert('Data successfully entered.');
            window.location.href = '/pages/infoPage.html';
        });
    </script>
        <li></li>
        <li></li>
    </main>

    <script>
        document.getElementById('userDisplay').textContent = activeUser;

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/pages/login.html';
        }
    </script>
