    <main>
        <header class = "home-banner" >
            <h1><span id = "userDisplay"></span>'s Urubilinogen Data Entry</h1>
        </header>

        <li></li>
        <h1>How to Assess Urubilinogen</h1>
        <p>This is currently in progress, and has not been developed.</p>
        <li></li>
        <li></li>

    <h2>Enter Urubilinogen Data</h2>
    <form id = "urubilinogenForm">
        <input type = "number" id = "apobNumber" placeholder = "Urubilinogen Number" required><br><br>
        <button type = "submit">Submit Urubilinogen Data</button>
    </form>

    <script>
        document.getElementById('APOBForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const enteredAPOB = parseFloat(document.getElementById('apobNumber').value);

            const MIN_APOB = 20;
            const MAX_APOB = 400;

            if (isNaN(enteredAPOB) || enteredAPOB < MIN_APOB || enteredAPOB > MAX_APOB) {
                alert('Invalid entry. Please enter a biologically realistic APOB value');
                return;
            }

            const userStorageKey = `APOBHistory_${activeUser}`;

            let APOBHistory = JSON.parse(localStorage.getItem(userStorageKey)) || [];

            const newAPOBDataPoint = {
                value: enteredAPOB,
                timestamp: new Date().toISOString(),
                label: `Entry ${APOBHistory.length + 1}`
            };

            APOBHistory.push(newAPOBDataPoint);
            localStorage.setItem(userStorageKey, JSON.stringify(APOBHistory));

            alert('Data successfully entered.');
            window.location.href = '/pages/infoPage.html';
        });
    </script>
        <li></li>
        <li></li>
    </main>

    <script>
        document.getElementById('userDisplay').textContent = activeUser;

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/pages/login.html';
        }
    </script>
</body>
</html>
