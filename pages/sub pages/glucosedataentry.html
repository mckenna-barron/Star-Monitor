    <main>
        <header class = "home-banner" >
            <h1><span id = "userDisplay"></span>'s Blood Glucose Data Entry</h1>
        </header>

        <li></li>
        <h1>How to Assess Blood Glucose Levels</h1>
        <p>This is currently in progress, and has not been developed.</p>
        <li></li>
        <li></li>

    <h2>Enter Blood Glucose Data</h2>
    <form id = "bgForm">
        <input type = "number" id = "bgNumber" placeholder = "Blood Glucose Number" required><br><br>
        <button type = "submit">Submit Blood Glucose Data</button>
    </form>

    <script>
        document.getElementById('bgForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const enteredBG = parseFloat(document.getElementById('bgNumber').value);

            const MIN_BG = 20;
            const MAX_BG = 400;

            if (isNaN(enteredBG) || enteredBG < MIN_BG || enteredBG > MAX_BG) {
                alert('Invalid entry. Please enter a biologically realistic blood glucose value');
                return;
            }

            const userStorageKey = `bgHistory_${activeUser}`;

            let bgHistory = JSON.parse(localStorage.getItem(userStorageKey)) || [];

            const newBGDataPoint = {
                value: enteredBG,
                timestamp: new Date().toISOString(),
                label: `Entry ${bgHistory.length + 1}`
            };

            bgHistory.push(newBGDataPoint);
            localStorage.setItem(userStorageKey, JSON.stringify(bgHistory));

            alert('Data successfully entered.');
            window.location.href = '/pages/infoPage.html';
        });
    </script>
        <li></li>
        <li></li>
    </main>

    <script>
        document.getElementById('userDisplay').textContent = activeUser;

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/pages/login.html';
        }
    </script>
</body>
</html>
