        <li></li>

    <h2>Enter Ketone Data</h2>
    <form id = "ketoneForm">
        <input type = "number" id = "ketoneNumber" placeholder = "Ketone Number" required><br><br>
        <button type = "submit">Submit Ketone Data</button>
    </form>

    <script>
        document.getElementById('ketoneForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const enteredKetone = parseFloat(document.getElementById('ketoneNumber').value);

            const MIN_KETONE = 20;
            const MAX_KETONE = 400;

            if (isNaN(enteredKETONE) || enteredKetone < MIN_KETONE || enteredKetone > MAX_KETONE) {
                alert('Invalid entry. Please enter a biologically realistic Ketone value');
                return;
            }

            const userStorageKey = `ketoneHistory_${activeUser}`;

            let ketoneHistory = JSON.parse(localStorage.getItem(userStorageKey)) || [];

            const newKetoneDataPoint = {
                value: enteredKetone,
                timestamp: new Date().toISOString(),
                label: `Entry ${ketoneHistory.length + 1}`
            };

            ketoneHistory.push(newKetoneDataPoint);
            localStorage.setItem(userStorageKey, JSON.stringify(ketoneHistory));

            alert('Data successfully entered.');
            window.location.href = '/pages/infoPage.html';
        });
    </script>
        <li></li>
        <li></li>
    </main>
