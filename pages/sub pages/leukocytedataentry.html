    </header>

    <main>
        <header class = "home-banner" >
            <h1><span id = "userDisplay"></span>'s Leukocyte Data Entry</h1>
        </header>

        <li></li>
        <h1>How to Assess Leukocyte Levels</h1>
        <p>This is currently in progress, and has not been developed.</p>
        <li></li>
        <li></li>

    <h2>Enter Leukocyte Data</h2>
    <form id = "lkForm">
        <input type = "number" id = "lkNumber" placeholder = "Leukocyte Number" required><br><br>
        <button type = "submit">Submit Leukocyte Data</button>
    </form>

    <script>
        document.getElementById('lkForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const enteredLK = parseFloat(document.getElementById('lkNumber').value);

            const MIN_LK = 20;
            const MAX_LK = 400;

            if (isNaN(enteredLK) || enteredLK < MIN_LK || enteredLK > MAX_LK) {
                alert('Invalid entry. Please enter a biologically realistic leukocyte value');
                return;
            }

            const userStorageKey = `lkHistory_${activeUser}`;

            let lkHistory = JSON.parse(localStorage.getItem(userStorageKey)) || [];

            const newLKDataPoint = {
                value: enteredLK,
                timestamp: new Date().toISOString(),
                label: `Entry ${lkHistory.length + 1}`
            };

            lkHistory.push(newLKDataPoint);
            localStorage.setItem(userStorageKey, JSON.stringify(lkHistory));

            alert('Data successfully entered.');
            window.location.href = '/pages/infoPage.html';
        });
    </script>
        <li></li>
        <li></li>
    </main>

    <script>
        document.getElementById('userDisplay').textContent = activeUser;

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/pages/login.html';
        }
    </script>
</body>
</html>
